spring:
  application:
    name: todo-api
    # プロジェクト直下の .env を読み込む（パスワードなどの秘密情報）
    # Đọc file .env ở thư mục gốc project (chứa mật khẩu và các secret khác)
  config:
    import: "optional:file:.env[.properties]"

  datasource:
    url: jdbc:mysql://localhost:3307/todo_db
    username: todo_user
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
server:
  port: 8080